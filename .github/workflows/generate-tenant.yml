name: Generate masjid tenant

# Scaffolds a tenant's build config when a masjid goes LIVE.
# Triggered two ways:
#   1. repository_dispatch (event_type: mosque-live) — fired by the
#      notify-mosque-live edge function when mosques.onboarding_status='live'.
#      Payload: { "slug": "mas-brooklyn-mqb18esx" }
#   2. workflow_dispatch — manual run with a slug, for backfills / re-runs.
#
# Output is a PR (never a direct push): config generation changes the shipped
# binary, so a human reviews and then triggers the EAS build.

on:
  repository_dispatch:
    types: [mosque-live]
  workflow_dispatch:
    inputs:
      slug:
        description: "mosques.slug to scaffold"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve slug
        id: slug
        run: |
          SLUG="${{ github.event.inputs.slug || github.event.client_payload.slug }}"
          if [ -z "$SLUG" ]; then echo "::error::no slug provided"; exit 1; fi
          echo "value=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Generate tenant config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/generate-tenant.mjs "${{ steps.slug.outputs.value }}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.slug.outputs.value }}
        run: |
          if git diff --quiet; then
            echo "No changes — tenant '$SLUG' already scaffolded. Skipping PR."
            exit 0
          fi
          BRANCH="tenant/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat(tenant): scaffold build config for $SLUG"
          git push -f origin "$BRANCH"
          gh pr create \
            --title "Tenant: $SLUG is going live" \
            --body "Auto-generated by \`generate-tenant.mjs\` from the Supabase \`mosques\` row.\n\n**Review, then trigger an EAS build with profile \`$SLUG-prod\`.**\n\n- Verify branding/colors in \`src/config/masjids/$SLUG.ts\`\n- Confirm bundle id \`com.sahla.$SLUG\` is registered in Apple/Google before submitting." \
            --head "$BRANCH" --base main || echo "PR may already exist for $BRANCH"
